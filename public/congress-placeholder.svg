<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2d5a"/>
      <stop offset="60%" stop-color="#143a72"/>
      <stop offset="100%" stop-color="#2f67b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#4da8e5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4da8e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <rect width="800" height="480" fill="url(#grid)"/>
  <rect width="800" height="480" fill="url(#glow)"/>
  <rect width="800" height="480" fill="url(#glow2)"/>
  <circle cx="120" cy="100" r="3" fill="#c9a84c"/>
  <circle cx="680" cy="380" r="3" fill="#4da8e5"/>
  <circle cx="640" cy="120" r="2" fill="#ffffff" opacity="0.6"/>
  <g transform="translate(400 240)">
